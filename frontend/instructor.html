<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Portal - HSBLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">
  <!-- Nav -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-3">
          <img src="/static/logo.png" alt="HSB Logo" class="h-8 w-auto object-contain rounded-md">
          <a href="/static/instructor.html" class="text-xl font-bold bg-gradient-to-r from-blue-700 via-indigo-600 to-purple-600 bg-clip-text text-transparent">HSBLearn</a>
        </div>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">Instructor Portal</span>
      </div>
      <div class="flex items-center space-x-4">
        <div class="text-right hidden sm:block">
          <div id="instructorName" class="text-sm font-semibold text-slate-800">Dr. Alex Morgan</div>
          <div class="text-xs text-slate-400">Instructor Account</div>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium transition">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Your Managed Courses</h1>
        <p class="text-sm text-slate-500">Create courses, manage chapters, upload lecture resources, and grant student access.</p>
      </div>
      <button onclick="openCourseModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-4 py-2.5 rounded-lg shadow-sm transition">
        + Create New Course
      </button>
    </div>

    <!-- Courses Grid -->
    <div id="instructorCourses" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="text-slate-400 text-sm py-8 text-center col-span-full">Loading courses...</div>
    </div>
  </main>

  <!-- Create Course Modal -->
  <div id="courseModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-slate-900 mb-4">Create New Course</h3>
      <form id="createCourseForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Course Title</label>
          <input type="text" id="courseTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Intro to Data Structures">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Course Description</label>
          <textarea id="courseDesc" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Core topics and objectives..."></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeCourseModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg">Create Course</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/instructor.js"></script>
</body>
</html>
