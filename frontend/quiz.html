<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Quiz - HSBLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">
  <!-- Nav -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <a href="/static/student.html" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent">HSBLearn</a>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">Practice Quiz</span>
      </div>
      <button onclick="window.location.href='/static/student.html'" class="text-xs text-slate-600 hover:text-slate-900 font-medium">Exit Quiz</button>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-6">
    <!-- Header -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
      <span class="text-xs uppercase font-bold text-indigo-600 tracking-wider">AI Grounded Assessment</span>
      <h1 class="text-2xl font-bold text-slate-900 mt-1" id="quizTitle">Loading Quiz...</h1>
      <p class="text-xs text-slate-500 mt-1" id="quizSource">Sources: ...</p>
    </div>

    <!-- Questions Form -->
    <form id="quizForm" class="space-y-6">
      <div id="questionsContainer" class="space-y-6">
        <div class="p-8 text-center text-slate-400">Loading quiz questions...</div>
      </div>

      <div id="submitContainer" class="flex justify-end pt-4">
        <button type="submit" id="btnSubmitQuiz" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow-sm transition">
          Submit Quiz Answers
        </button>
      </div>
    </form>

    <!-- Results Container -->
    <div id="quizResultContainer" class="hidden bg-white border border-slate-200 rounded-2xl p-8 shadow-sm space-y-6">
      <div class="text-center">
        <span class="text-xs uppercase font-bold tracking-wider text-emerald-600">Quiz Graded</span>
        <h2 class="text-3xl font-extrabold text-slate-900 mt-1">
          Your Score: <span id="resScore">0</span> / <span id="resTotal">0</span> (<span id="resPct">0%</span>)
        </h2>
        <p class="text-xs text-slate-500 mt-2">Answers graded server-side and recorded in your progress history.</p>
      </div>

      <div class="border-t border-slate-100 pt-6 space-y-4" id="feedbackList"></div>

      <div class="flex justify-center gap-4 pt-4">
        <button onclick="window.location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg transition">
          Retake Quiz
        </button>
        <a href="/static/progress.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
          View Progress Dashboard &rarr;
        </a>
      </div>
    </div>
  </main>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/quiz.js"></script>
</body>
</html>
