<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - HSBLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50/40 to-pink-50/30 min-h-screen text-slate-800 flex flex-col justify-between">
  <!-- Header -->
  <header class="glass-card border-b border-indigo-100/80 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img src="/static/logo.png" alt="HSB Logo" class="h-9 w-auto object-contain rounded-lg">
        <a href="/static/index.html" class="text-xl font-extrabold bg-gradient-to-r from-blue-700 via-indigo-600 to-purple-600 bg-clip-text text-transparent">HSBLearn</a>
      </div>
      <a href="/static/index.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600">Back to Sign In</a>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-md mx-auto px-4 py-12 flex-grow flex flex-col justify-center w-full">
    <div class="glass-card p-8 rounded-2xl shadow-xl border border-white/80 space-y-6">
      <div class="text-center">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold mx-auto mb-3 border border-indigo-200">
          🔑
        </div>
        <h2 class="text-2xl font-bold text-slate-900">Set New Password</h2>
        <p class="text-xs text-slate-500 mt-1">Please enter and confirm your new secure password.</p>
      </div>

      <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-medium"></div>

      <form id="resetForm" class="space-y-4">
        <input type="hidden" id="resetToken">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">New Password</label>
          <input type="password" id="newPassword" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="6" placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-500/25 transition">
          Update Password &rarr;
        </button>
      </form>

      <div id="successPanel" class="hidden text-center space-y-4 pt-2">
        <p class="text-xs text-emerald-700 font-bold bg-emerald-50 p-3 rounded-xl border border-emerald-200">
          ✓ Password changed successfully!
        </p>
        <a href="/static/index.html" class="inline-block bg-indigo-600 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-md shadow-indigo-500/20">
          Sign In Now &rarr;
        </a>
      </div>
    </div>
  </main>

  <footer class="glass-card border-t border-indigo-100/60 py-4 text-center text-xs text-slate-400">
    HSBLearn &copy; 2026 &middot; Secure Password Management
  </footer>

  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const alertBox = document.getElementById('alertBox');
      const resetForm = document.getElementById('resetForm');

      if (!token) {
        alertBox.className = 'p-3 rounded-xl text-xs bg-rose-50 text-rose-700 border border-rose-200 font-semibold';
        alertBox.innerText = 'Missing password reset token. Please request a new link.';
        resetForm.classList.add('hidden');
        return;
      }
      document.getElementById('resetToken').value = token;
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('resetToken').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('alertBox');
      const btnSubmit = document.getElementById('btnSubmit');

      if (newPassword !== confirmPassword) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-xs bg-rose-50 text-rose-700 border border-rose-200 font-semibold';
        alertBox.innerText = 'Passwords do not match.';
        return;
      }

      alertBox.className = 'hidden';
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Updating...';

      try {
        const res = await apiRequest('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, new_password: newPassword })
        });
        document.getElementById('resetForm').classList.add('hidden');
        document.getElementById('successPanel').classList.remove('hidden');
      } catch (err) {
        alertBox.className = 'mb-4 p-3 rounded-xl text-xs bg-rose-50 text-rose-700 border border-rose-200 font-semibold';
        alertBox.innerText = err.message || 'Failed to update password.';
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Update Password →';
      }
    });
  </script>
</body>
</html>
