<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details - HSBLearn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">
  <!-- Nav -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <a id="backHomeLink" href="/static/student.html" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-blue-600 bg-clip-text text-transparent">HSBLearn</a>
        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700">Course View</span>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="window.history.back()" class="text-xs text-slate-600 hover:text-slate-900 font-medium">&larr; Back</button>
        <button onclick="logout()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 py-1.5 px-3 rounded-lg font-medium transition">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full space-y-8">
    <!-- Course Banner -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <span class="text-xs uppercase font-bold tracking-wider text-indigo-600" id="courseSubtitle">Shared Course</span>
          <h1 class="text-2xl font-bold text-slate-900 mt-1" id="courseTitle">Loading...</h1>
          <p class="text-sm text-slate-600 mt-1" id="courseDesc"></p>
        </div>
        <div id="instructorActions" class="hidden flex gap-2">
          <button onclick="openChapterModal()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition">
            + Add Chapter
          </button>
          <button onclick="openUploadModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition">
            + Upload Material
          </button>
          <button onclick="openEnrollModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3.5 py-2 rounded-lg transition">
            Grant Access
          </button>
          <button onclick="handleDeleteCurrentCourse()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-semibold px-3 py-2 rounded-lg transition">
            Delete Course
          </button>
        </div>
      </div>
    </div>

    <!-- Layout: Chapters & Materials -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Chapters sidebar -->
      <div class="lg:col-span-1 space-y-4">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500">Chapters & Modules</h3>
        <div id="chaptersList" class="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 shadow-sm">
          <div class="p-4 text-xs text-slate-400">Loading chapters...</div>
        </div>
      </div>

      <!-- Materials List -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500">Shared Course Materials</h3>
          <span class="text-xs text-slate-400" id="materialsCount">0 files</span>
        </div>

        <div id="materialsList" class="space-y-3">
          <div class="p-8 bg-white border border-slate-200 rounded-xl text-center text-sm text-slate-400">Loading materials...</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modals for Instructor -->
  <div id="chapterModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-slate-900 mb-4">Add Chapter / Topic</h3>
      <form id="chapterForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
          <input type="text" id="chapTitle" required class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Description</label>
          <input type="text" id="chapDesc" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeChapterModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="uploadModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-slate-900 mb-4">Upload Course Files</h3>
      <form id="uploadForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Select Chapter</label>
          <select id="chapSelect" class="w-full px-3 py-2 border rounded-lg text-sm"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Choose Files (PDF, PPTX, DOCX, TXT)</label>
          <input type="file" id="courseFiles" multiple required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
        <div id="uploadStatusText" class="text-xs text-indigo-600 hidden">Uploading & extracting text...</div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeUploadModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
          <button type="submit" id="btnUploadSubmit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <div id="enrollModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold text-slate-900 mb-4">Grant Student Access</h3>
      <form id="enrollForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Student Email Address</label>
          <input type="email" id="enrollEmail" required placeholder="student2@hsblearn.local" class="w-full px-3 py-2 border rounded-lg text-sm">
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeEnrollModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg">Grant Access</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js?v=2"></script>
  <script src="/static/js/course.js?v=2"></script>
</body>
</html>
